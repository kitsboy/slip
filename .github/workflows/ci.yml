name: ci

# The same gates `scripts/deploy.sh` runs locally, so a green CI means the artifact
# could actually be published — not merely that the source compiles.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: node scripts/check-budget.mjs

      - name: Docs audit
        run: node scripts/docs-audit.mjs --strict

      - name: Scan the shipped artifact
        run: bash scripts/scan-bundle.sh dist/index.html

      - name: Publish the hash as an artifact
        uses: actions/upload-artifact@v6
        with:
          name: slip-artifact
          path: |
            dist/index.html
            dist/SHA256SUMS
            dist/_headers
          retention-days: 14

  e2e:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Serve the built app and run the browser suites
        run: |
          set -euo pipefail
          npx vite preview --port 4181 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4181/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4181/ >/dev/null
          node tests/e2e/run-all.mjs http://127.0.0.1:4181/
          node scripts/tap-audit.mjs http://127.0.0.1:4181/
