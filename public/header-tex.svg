<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="96" viewBox="0 0 1600 96">
  <!--
    The header's dim stencil, tiled horizontally and drifted slowly behind the wordmark.

    Brass geometry, never type, so it needs no font and cannot show as a box on a phone. Seamless
    left to right: the hatching runs past both edges so it continues across the tile seam, and the
    round marks sit near the middle. Alphas are low on purpose — the page multiplies by 0.2 again.
  -->
  <g opacity="0.5" fill="none" stroke="#f0a32a" stroke-width="1">
    <path d="M-96 96 L0 0 M-48 96 L48 0 M0 96 L96 0 M48 96 L144 0 M96 96 L192 0
             M144 96 L240 0 M192 96 L288 0 M240 96 L336 0 M288 96 L384 0 M336 96 L432 0
             M384 96 L480 0 M432 96 L528 0 M480 96 L576 0 M528 96 L624 0 M576 96 L672 0
             M624 96 L720 0 M672 96 L768 0 M720 96 L816 0 M768 96 L864 0 M816 96 L912 0
             M864 96 L960 0 M912 96 L1008 0 M960 96 L1056 0 M1008 96 L1104 0 M1056 96 L1152 0
             M1104 96 L1200 0 M1152 96 L1248 0 M1200 96 L1296 0 M1248 96 L1344 0 M1296 96 L1392 0
             M1344 96 L1440 0 M1392 96 L1488 0 M1440 96 L1536 0 M1488 96 L1584 0 M1536 96 L1632 0
             M1584 96 L1680 0 M1632 96 L1728 0 M1680 96 L1776 0" />
  </g>

  <!-- The rings sit off-centre so they never read as a halo behind the centred wordmark or the
       header buttons; on a wide screen the tile repeats and they appear again further along. -->
  <g fill="none" stroke="#f0a32a" stroke-width="1.2">
    <circle cx="392" cy="96" r="34" opacity="0.6" />
    <circle cx="392" cy="96" r="62" opacity="0.36" stroke-dasharray="2 9" />
    <circle cx="392" cy="96" r="92" opacity="0.24" stroke-dasharray="1 13" />
    <circle cx="392" cy="96" r="124" opacity="0.14" stroke-dasharray="1 17" />
  </g>
  <g fill="#f0a32a" opacity="0.5">
    <circle cx="520" cy="22" r="2" />
    <circle cx="572" cy="48" r="1.5" />
    <circle cx="1066" cy="26" r="2" />
    <circle cx="1114" cy="54" r="1.5" />
    <circle cx="700" cy="12" r="1.3" />
    <circle cx="902" cy="14" r="1.3" />
  </g>

  <g fill="none" stroke="#f0a32a" stroke-width="1" opacity="0.35">
    <path d="M120 14 h170" stroke-dasharray="12 9" />
    <path d="M1310 82 h170" stroke-dasharray="12 9" />
  </g>
</svg>
